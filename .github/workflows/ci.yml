name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Every route in this app renders dynamically (something in the tree —
      # the Header's session check — calls `cookies()`, which opts the whole
      # route out of static generation), so `next build` never actually
      # queries Postgres/Redis at build time. It only needs env vars
      # well-formed enough to satisfy `src/config/env.ts`'s Zod schema:
      # `BTC_ACCOUNT_XPUB` must be a real base58check-valid public extended
      # key (any throwaway one derived from a random seed works — it's
      # watch-only public data, not a secret), and the DB/Redis URLs just
      # need to parse as URLs, not be reachable. Confirmed by building with
      # these exact fake values and no services running at all.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://fake:fake@localhost:59999/fake
          REDIS_URL: redis://localhost:59998
          BTC_ACCOUNT_XPUB: tpubDDTyJEgNqk6uZKJ6vdM1HdNytMarfrTJBkQH1MGSiYrCnPrkXr1642ndLRb1FbDYBRbHzrq25w2MsGrRrEZziNj1v3BQcmxjYqAMc4iaVQ6
