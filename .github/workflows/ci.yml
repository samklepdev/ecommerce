name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Only the migration step touches this. Everything else in the job runs
    # without infra by design — the unit suite has no database at all.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migrationcheck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The IP geolocation database is gitignored — it's 59 MB and refreshed
      # monthly, so committing it would grow history by that much forever.
      # A fresh checkout therefore has none, and the adapter's tests would
      # assert against an absent file. Keyed by month because that's DB-IP's
      # release cadence: one download per release, cache hits in between.
      - name: Resolve geo database release
        id: geo-release
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache IP geolocation database
        id: geo-cache
        uses: actions/cache@v4
        with:
          path: src/modules/analytics/infrastructure/geo/dbip-city-lite.mmdb.gz
          key: dbip-city-lite-${{ steps.geo-release.outputs.month }}

      - name: Fetch IP geolocation database
        if: steps.geo-cache.outputs.cache-hit != 'true'
        run: npm run geo:fetch

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # A vulnerable dependency is only cheap to fix before it ships. Scoped
      # to production deps and high+ severity on purpose: dev-only advisories
      # and low-severity noise would make this fail constantly and get
      # ignored, which is worse than not having it.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Catches the migration that only fails when applied. `db:migrate`
      # against a real (empty) Postgres proves every file in drizzle/ still
      # runs in order from nothing — the case a fresh environment hits and
      # nobody's laptop does.
      - name: Apply migrations against a clean database
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/migrationcheck

      # Every route in this app renders dynamically (something in the tree —
      # the Header's session check — calls `cookies()`, which opts the whole
      # route out of static generation), so `next build` never actually
      # queries Postgres/Redis at build time. It only needs env vars
      # well-formed enough to satisfy `src/config/env.ts`'s Zod schema:
      # `BTC_ACCOUNT_XPUB` must be a real base58check-valid public extended
      # key (any throwaway one derived from a random seed works — it's
      # watch-only public data, not a secret), and the DB/Redis URLs just
      # need to parse as URLs, not be reachable. Confirmed by building with
      # these exact fake values and no services running at all.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://fake:fake@localhost:59999/fake
          REDIS_URL: redis://localhost:59998
          BTC_ACCOUNT_XPUB: tpubDDTyJEgNqk6uZKJ6vdM1HdNytMarfrTJBkQH1MGSiYrCnPrkXr1642ndLRb1FbDYBRbHzrq25w2MsGrRrEZziNj1v3BQcmxjYqAMc4iaVQ6

  # A second job rather than more steps on the first: this one needs real
  # services, and keeping them apart means a Postgres image failing to pull
  # can't fail the typecheck/lint/unit run that needs nothing.
  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: storefront_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d storefront_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Ports match docker-compose.test.yml so the URLs are the same here as
      # on a laptop, and `assertSafeTestTarget` recognises them as a
      # throwaway target rather than someone's real database.
      - name: Integration tests
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5433/storefront_test
          TEST_REDIS_URL: redis://localhost:6380
