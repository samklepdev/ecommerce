services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecommerce']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # `web` and `worker` run the same built image as the `web`/`worker`
  # processes described in src/workers/btc-watcher.ts's own doc comment —
  # bring the whole stack up with `docker compose up` to test the production
  # image locally before deploying. Not part of the everyday dev loop
  # (`npm run dev` talks to `postgres`/`redis` above directly); start these
  # two only when you want a production-shaped smoke test.
  web:
    build: .
    # Without this a crash is permanent until someone notices. Applies to
    # `docker compose` only — on a managed host, set the equivalent there.
    restart: unless-stopped
    healthcheck:
      # Hits /api/health, which checks Postgres, Redis and the watcher's
      # heartbeat, and answers 503 when any of them is down.
      # A block scalar, not a quoted flow sequence: this command needs both
      # double and single quotes, and YAML escapes a single quote inside a
      # single-quoted string by doubling it, never with a backslash. Written
      # as `\'` it silently ends the string and breaks the whole file — which
      # it did, taking `docker compose` with it for every service, not just
      # this one. Here nothing needs escaping at all.
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      DATABASE_URL: postgres://ecommerce:ecommerce@postgres:5432/ecommerce
      REDIS_URL: redis://redis:6379
      # Bind-mounted rather than baked into the image: the archive is 59 MB
      # and is refreshed monthly, so it belongs to the host, not the build.
      # Populate ./geo once with: IP_GEO_DB_PATH=./geo/dbip-city-lite.mmdb.gz npm run geo:fetch
      IP_GEO_DB_PATH: /data/geo/dbip-city-lite.mmdb.gz
    volumes:
      - ./geo:/data/geo:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ['npm', 'run', 'worker']
    # The only process that notices a customer paid. A crash here is silent —
    # orders simply stop settling — so it restarts, and /api/health reports
    # the heartbeat going stale if restarting isn't enough.
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://ecommerce:ecommerce@postgres:5432/ecommerce
      REDIS_URL: redis://redis:6379
      # Bind-mounted rather than baked into the image: the archive is 59 MB
      # and is refreshed monthly, so it belongs to the host, not the build.
      # Populate ./geo once with: IP_GEO_DB_PATH=./geo/dbip-city-lite.mmdb.gz npm run geo:fetch
      IP_GEO_DB_PATH: /data/geo/dbip-city-lite.mmdb.gz
    volumes:
      - ./geo:/data/geo:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
